# Brand definition shared by the Quarto outputs (analytical notebook, executive
# report, deck). Derived from the Power BI theme in theme/rfm_dashboard_theme.json
# ("RFM Customer Segmentation – Palette C Muted Earth") and the Theme row in
# docs/architecture.md, except the fonts.
# Segment colours follow the Segment Color measure in docs/measures.md and
# dim_Segment[SegmentColor] in the semantic model. Schema: brand.yml as validated
# by Quarto 1.9 (share/schema/definitions.yml, brand-single). The SVG logo is not
# referenced: its colour (#3c2415) sits outside this palette.

meta:
  name:
    full: Kupferkanne RFM customer segmentation
    short: Kupferkanne RFM

color:
  palette:
    # The ten dataColors, in theme order.
    c1: "#4A7AA0"
    c2: "#7BA8B8"
    c3: "#8FA87E"
    c4: "#D4A762"
    c5: "#A05A55"
    c6: "#A5A29A"
    c7: "#6B7F94"
    c8: "#B8916A"
    c9: "#9DAE96"
    c10: "#7A6E6E"
    # Segment colours and the fallback follow the Segment Color measure in docs/measures.md.
    champions: "#4A7AA0"
    loyal_customers: "#7BA8B8"
    potential_loyalists: "#8FA87E"
    recent_customers: "#D4A762"
    at_risk: "#A05A55"
    hibernating: "#A5A29A"
    segment_fallback: "#94A3B8"
    # Exhibit focus marks for Hibernating: hibernating darkened in OKLab lightness (hue and
    # chroma held) to the first 0.01 step that reaches 3:1 on #FFFFFF and #F1EFE9 and 2:1 on
    # the exhibits' context grey. Derived and asserted in exhibits_win_back.qmd.
    hibernating_focus: "#8A877F"
    # Muted text on the exhibits and the notebook charts: label darkened in OKLab lightness
    # (hue and chroma held) to the first 0.01 step that reaches 4.5:1 on #FFFFFF, #F7F5F1 and
    # #F1EFE9. Derived and asserted in exhibits_win_back.qmd.
    label_text: "#5E6E85"
    # Surfaces and chrome from the theme.
    page: "#F7F5F1"     # report page background
    border: "#DDD6CC"   # visual border; exhibit gridlines only (context bars use a 32% foreground blend computed in the notebook)
    label: "#64748B"    # theme label text class; source of label_text, the exhibits' muted text colour
  foreground: "#3D4752"  # theme foreground: text on the canvas
  background: "#FFFFFF"  # canvas
  primary: c1            # theme tableAccent

typography:
  fonts:
    - family: Lato
      source: google
      weight: [400, 700]
      style: [normal, italic]
  # Lato for body text and headings. The render embeds four Lato faces (400 and
  # 700, normal and italic) in each self-contained page; headings use the
  # 700 face. SVG exhibits loaded as images cannot use page fonts.
  base:
    family: "Lato, sans-serif"
  headings:
    family: "Lato, sans-serif"
    weight: 700  # Lato Bold, as in the exhibit headings
