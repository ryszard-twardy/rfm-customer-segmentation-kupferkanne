 <title>At the playbook's rates, each 1,000 EUR of discount retains 2,483 EUR of contribution in At Risk, against 1,334 EUR in Hibernating</title>
 <desc>Horizontal bar chart of contribution per 1,000 EUR of discount at the playbook's rates (15% for At Risk, 20% for Hibernating): At Risk 2,483 EUR, Hibernating 1,334 EUR, a gap of 1,149 EUR. At these rates At Risk retains 1.86 times as much contribution per euro of discount as Hibernating; with either rate applied to both segments, about 1.2 times as much. The figure measures margin efficiency, not incremental return.</desc>
