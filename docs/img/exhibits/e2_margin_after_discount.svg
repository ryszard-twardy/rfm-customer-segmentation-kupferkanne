 <title>The playbook gives the deeper discount to the thinner margin: after its offer At Risk keeps 37 points of order value, Hibernating 27</title>
 <desc>Dot-and-arrow chart for At Risk and Hibernating: each arrow runs from realised gross margin before the win-back discount (light dot) to contribution after it (dark dot), in percent of pre-offer order value. At Risk falls from 52.24% to 37.24% after a 15% discount; Hibernating falls from 46.68% to 26.68% after a 20% discount.</desc>
