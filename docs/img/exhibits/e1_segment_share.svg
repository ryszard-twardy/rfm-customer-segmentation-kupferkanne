 <title>A quarter of scored customers sit in At Risk or Hibernating, and their lifetime spend is 2% of the revenue base</title>
 <desc>Paired horizontal bar chart of the six RFM segments: a filled bar gives each segment's share of scored customers, an outlined bar its share of the revenue base. At Risk holds 9.13% of customers and 1.26% of revenue, Hibernating 16.99% and 0.76%; together 26.1% of scored customers and 2.0% of the revenue base. The other four segments are grey context.</desc>
